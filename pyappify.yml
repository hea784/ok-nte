name: "ok-nte"
uac: true
icon: "icons/icon.png"
website: "https://ok-script.com/ok-nte"
packaging: packaging

mirrorchyan:
  resource_id: ok-nte-zip
  stable_channel: stable

profiles:
  - name: "China"
    # Fork build: install and update from this fork so the patched capture
    # framework ships and survives app updates.
    git_url: "https://github.com/hea784/ok-nte.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true

  - name: "Global"
    git_url: "https://github.com/hea784/ok-nte.git"
    main_script: "main.py"
    requirements: "requirements.txt"
